name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    # 07:00, 12:00, 18:00 WIB (UTC+7) = 00:00, 05:00, 11:00 UTC
    - cron: "0 0,5,11 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    name: Hackatime Dev Metrics Update (last 7 days)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update README with last 7 days of Hackatime stats
        env:
          HACKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }} # Hackatime API key
          HACKATIME_USERNAME: Huruhara
          SECTION_NAME: wakatime
          CODE_LANG: typescript
          LANG_COUNT: 10
          DAYS: 7
          TARGET_PATH: README.md
        run: python .github/scripts/hackatime_readme.py

      - name: Commit changes
        run: |
          if git diff --quiet README.md; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Updated waka-readme graph with new metrics"
          git push
